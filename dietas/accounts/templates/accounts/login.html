<!DOCTYPE html>
<html lang="es">
<!-- [Head] start -->

<head>
    <title>Iniciar Sesión</title>
    <!-- [Meta] -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Mantis is made using Bootstrap 5 design framework. Download the free admin template & use it for your project.">
    <meta name="keywords" content="Mantis, Dashboard UI Kit, Bootstrap 5, Admin Template, Admin Dashboard, CRM, CMS, Bootstrap Admin Template">
    <meta name="author" content="CodedThemes">
    {% load static %}
    <!-- [Favicon] icon -->

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" id="main-font-link">
    <!-- [Tabler Icons] https://tablericons.com -->
    <link rel="stylesheet" href="{% static '/assets_login/fonts/tabler-icons.min.css' %}" >
    <!-- [Feather Icons] https://feathericons.com -->
    <link rel="stylesheet" href="{% static '/assets_login/fonts/feather.css' %}" >
    <!-- [Font Awesome Icons] https://fontawesome.com/icons -->
    <link rel="stylesheet" href="{% static '/assets_login/fonts/fontawesome.css' %}" >
    <!-- [Material Icons] https://fonts.google.com/icons -->
    <link rel="stylesheet" href="{% static '/assets_login/fonts/material.css' %}" >
    <!-- [Template CSS Files] -->
    <link rel="stylesheet" href="{% static '/assets_login/css/style.css' %}" id="main-style-link" >
    <link rel="stylesheet" href="{% static '/assets_login/css/style-preset.css' %}" >

</head>

<body>
    <!-- [ Pre-loader ] start -->
    <div class="loader-bg">
        <div class="loader-track">
        <div class="loader-fill"></div>
        </div>
    </div>
    <!-- [ Pre-loader ] End -->

    <div class="auth-main">
        <div class="auth-wrapper v3">
        <div class="auth-form">
            <div class="card my-5">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-end mb-4">
                <h3 class="mb-0"><b>Login</b></h3>  
                </div>

                <form method="post" class="form-group mb-3">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit">Iniciar Sesión</button>
                </form>
                {% if error %}
                    <p style="color: red;">{{ error }}</p>
                {% endif %}

            </div>
            </div>
        </div>
        </div>
    </div>
</body>
    <!-- [ Main Content ] end -->
    <!-- Required Js -->
    <script src="{% static '/assets_login/js/plugins/popper.min.js' %}"></script>
    <script src="{% static '/assets_login/js/plugins/simplebar.min.js' %}"></script>
    <script src="{% static '/assets_login/js/plugins/bootstrap.min.js' %}"></script>
    <script src="{% static '/assets_login/js/fonts/custom-font.js' %}"></script>
    <script src="{% static '/assets_login/js/pcoded.js' %}"></script>
    <script src="{% static '/assets_login/js/plugins/feather.min.js' %}"></script> 
    
    <script>layout_change('light');</script>
